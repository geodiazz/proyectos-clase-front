<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather api!</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="card">
        <div class="search-bar">
            <input type="text" placeholder="¿que ciudad deseas buscar?" spellcheck="false">
            <button><img src="/images/search.png" alt=""></button>
        </div>
        <div class="error">
            <p>No se encontro la ciudad buscada :(</p>
        </div>
        <div class="weather">
            <img src="/images/rain.png" alt="" class="weather-icon">
            <h1 class="temp">23 &deg;C</h1>
            <h2 class="city">medellin</h2>
            <div class="details">
                <div class="col">
                    <img src="/images/humidity.png" alt="">
                    <div>
                        <p class="humidity">40%</p>
                        <p>Humedad</p>
                    </div>
                </div>
                <div class="col">
                    <img src="/images/wind.png" alt="">
                    <div>
                        <p class="wind">12km/h</p>
                        <p>Velocidad del viento</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="/script.js"></script>
</html>
